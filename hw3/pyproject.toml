[project]
name = "hw3"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.4.6"]

[dependency-groups]
dev = [
    "cmake>=3.20,<4",
    "ninja>=1.11",
    "pybind11>=2.13,<4",
    "clang-format>=18",
    "jupyter>=1.1.1",
    "mugrade",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv.sources]
mugrade = { git = "https://github.com/dlsys10714/mugrade.git" }

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# 保留课程模块导出及导入顺序，只启用基础语法检查。
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "F401", "F403", "F405", "F841"]

[tool.ruff.lint.per-file-ignores]
# 官方骨架先定义 NumPy 名称，再通过后端选择模块覆盖。
"python/needle/autograd.py" = ["F811"]
"tests/**" = ["F821", "E731"]
